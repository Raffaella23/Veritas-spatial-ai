<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="900" role="img" aria-label="EIDETICA — caricamento">
  <title>EIDETICA — schermata di caricamento</title>

  <defs>
    <linearGradient id="ali" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2E5BFF"/>
      <stop offset="0.32" stop-color="#7B2FF7"/>
      <stop offset="0.62" stop-color="#E0219A"/>
      <stop offset="1"    stop-color="#FF9A1F"/>
    </linearGradient>
    <radialGradient id="iride" cx="0.38" cy="0.34" r="0.78">
      <stop offset="0"    stop-color="#B98CFF"/>
      <stop offset="0.45" stop-color="#5B2BD6"/>
      <stop offset="1"    stop-color="#1B0B45"/>
    </radialGradient>
    <filter id="alone" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dentroIride"><circle cx="260" cy="150" r="33"/></clipPath>
  </defs>

  <rect width="520" height="300" fill="#ffffff"/>

  <!-- LE ALI. Si aprono una volta, poi respirano: e' il movimento del girare
       attorno a una cosa per capirla. -->
  <g fill="url(#ali)" opacity="0.96">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 6; 0 0; 0 6" dur="3.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
      <path d="M232 138 C186 118 130 96 74 92 C118 118 156 138 196 152 Z"/>
      <path d="M236 152 C196 146 148 144 104 152 C150 166 194 168 232 164 Z" opacity="0.82"/>
      <path d="M288 138 C334 118 390 96 446 92 C402 118 364 138 324 152 Z"/>
      <path d="M284 152 C324 146 372 144 416 152 C370 166 326 168 288 164 Z" opacity="0.82"/>
    </g>
  </g>

  <!-- L'OCCHIO -->
  <path d="M186 150 C214 108 306 108 334 150 C306 192 214 192 186 150 Z"
        fill="#ffffff" stroke="url(#ali)" stroke-width="7" stroke-linejoin="round"/>

  <circle cx="260" cy="150" r="33" fill="url(#iride)"/>

  <!-- LA RETE DENTRO L'IRIDE: i punti si accendono UNO ALLA VOLTA.
       Non e' un ornamento — e' letteralmente cosa fa il programma mentre
       aspetti: guarda una vista per volta e ogni volta capisce un pezzo. -->
  <g clip-path="url(#dentroIride)" stroke="#CBB4FF" stroke-width="0.9" fill="none" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 260 150" to="360 260 150" dur="14s" repeatCount="indefinite"/>
      <path d="M236 132 L262 141 L286 129 M262 141 L258 164 L236 172 M258 164 L288 168 M286 129 L292 152 L288 168"/>
      <path d="M236 132 L232 156 L236 172 M292 152 L262 141" opacity="0.55"/>
    </g>
  </g>
  <g clip-path="url(#dentroIride)" fill="#FFFFFF">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 260 150" to="360 260 150" dur="14s" repeatCount="indefinite"/>
      <circle cx="236" cy="132" r="2.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0s"    repeatCount="indefinite"/></circle>
      <circle cx="262" cy="141" r="2.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0.35s" repeatCount="indefinite"/></circle>
      <circle cx="286" cy="129" r="1.9"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0.7s"  repeatCount="indefinite"/></circle>
      <circle cx="292" cy="152" r="2.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="1.05s" repeatCount="indefinite"/></circle>
      <circle cx="288" cy="168" r="1.8"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="1.4s"  repeatCount="indefinite"/></circle>
      <circle cx="258" cy="164" r="2.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="1.75s" repeatCount="indefinite"/></circle>
      <circle cx="236" cy="172" r="1.9"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="2.1s"  repeatCount="indefinite"/></circle>
      <circle cx="232" cy="156" r="2.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="2.45s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- il lampo dell'iride: la fiducia che sale -->
  <circle cx="248" cy="140" r="5" fill="#ffffff" filter="url(#alone)" opacity="0.9">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.6;5.4;3.6" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="150" r="40" fill="none" stroke="url(#ali)" stroke-width="3.5" opacity="0.9"/>

  <!-- il nome -->
  <text x="260" y="238" text-anchor="middle" fill="#16183A"
        font-family="'Segoe UI', system-ui, sans-serif" font-size="34"
        letter-spacing="9" font-weight="600">EIDETICA</text>
  <text x="260" y="262" text-anchor="middle" fill="#7B2FF7"
        font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5"
        letter-spacing="3.4" opacity="0.9">THE INTELLIGENCE LAYER FOR SPACE</text>

  <!-- la barra: NON finta. Sta ferma finche' non c'e' un progresso vero da
       mostrare, e chi la accende passa una percentuale misurata. -->
  <g transform="translate(190,278)">
    <rect width="140" height="3" rx="1.5" fill="#E9E7F5"/>
    <rect width="140" height="3" rx="1.5" fill="url(#ali)" opacity="0.95">
      <animate attributeName="width" values="0;46;140;140" dur="2.8s"
               keyTimes="0;0.35;0.85;1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.95;0.95;0" dur="2.8s"
               keyTimes="0;0.35;0.85;1" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
