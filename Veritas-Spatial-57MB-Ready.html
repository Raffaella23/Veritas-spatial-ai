  const ARCHETYPES = {

  function lineHasSupport(a, b, points, sampleN, radius) {
    sampleN = sampleN || 6; radius = radius || 2.5;
    if (!points || !points.length) return true; // nessun dato -> non blocca (comportamento precedente)
    let ok = 0;
    for (let i = 0; i <= sampleN; i++) {
      const t = i / sampleN;
      const px = a[0] + (b[0] - a[0]) * t, pz = a[2] + (b[2] - a[2]) * t;
      let found = false;
      for (const p of points) { if (Math.hypot(p[0] - px, p[2] - pz) < radius) { found = true; break; } }
      if (found) ok++;
    }
    return ok / (sampleN + 1) >= 0.7;
  }

  function buildZoneGraph(zones, points) {
    const n = zones.length;
    const adj = Array.from({ length: n }, () => []);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (lineHasSupport(zones[i].pos, zones[j].pos, points)) {
          const d = Math.hypot(zones[i].pos[0] - zones[j].pos[0], zones[i].pos[2] - zones[j].pos[2]);
          adj[i].push({ to: j, d }); adj[j].push({ to: i, d });
        }
      }
    }
    return adj;
  }

  function dijkstra(adj, start, end) {
    const dist = new Array(adj.length).fill(Infinity), prev = new Array(adj.length).fill(-1), visited = new Array(adj.length).fill(false);
    dist[start] = 0;
    for (let iter = 0; iter < adj.length; iter++) {
      let u = -1, best = Infinity;
      for (let i = 0; i < adj.length; i++) if (!visited[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u === -1) break;
      visited[u] = true;
      if (u === end) break;
      for (const e of adj[u]) { if (dist[u] + e.d < dist[e.to]) { dist[e.to] = dist[u] + e.d; prev[e.to] = u; } }
    }
    if (dist[end] === Infinity) return null;
    const path = [];
    for (let c = end; c !== -1; c = prev[c]) path.unshift(c);
    return path;
  }

  // Trova un percorso tra due punti che rispetta la geometria reale: se la
  // linea diretta e "libera" (passa vicino a punti navigabili reali) la usa,
  // altrimenti passa per le zone rilevate dall'analisi (evita di attraversare
  // muri/ostacoli che non fanno parte dello spazio calpestabile).
  function findRoute(fromPos, toPos) {
    if (!lastZones || !lastZones.length || !lastNavigablePoints) return [toPos];
    if (lineHasSupport(fromPos, toPos, lastNavigablePoints)) return [toPos];
    let fi = 0, fd = Infinity, ti = 0, td = Infinity;
    lastZones.forEach((z, i) => {
      const df = Math.hypot(z.pos[0] - fromPos[0], z.pos[2] - fromPos[2]);
      const dt = Math.hypot(z.pos[0] - toPos[0], z.pos[2] - toPos[2]);
      if (df < fd) { fd = df; fi = i; }
      if (dt < td) { td = dt; ti = i; }
    });
    if (fi === ti) return [toPos];
    if (!lastZoneGraph) lastZoneGraph = buildZoneGraph(lastZones, lastNavigablePoints);
    const route = dijkstra(lastZoneGraph, fi, ti);
    if (!route) return [toPos];
    return route.map((zi) => lastZones[zi].pos).concat([toPos]);
  }
  let lastZoneGraph = null;

  function resolveOverlaps(frameAgents) {
    // evitamento tra agenti: spinge via chi e troppo vicino, cosi non si
    // sovrappongono camminando — piu iterazioni per stabilizzare gruppi fitti
    const MIN_SEP = 0.55, ITER = 3;
    for (let it = 0; it < ITER; it++) {
      for (let i = 0; i < frameAgents.length; i++) {
        for (let j = i + 1; j < frameAgents.length; j++) {
          const a = frameAgents[i], b = frameAgents[j];
          if (a.state === "ARRIVED" || b.state === "ARRIVED") continue;
          const dx = b.pos[0] - a.pos[0], dz = b.pos[2] - a.pos[2];
          const d = Math.hypot(dx, dz);
          if (d > 0 && d < MIN_SEP) {
            const push = (MIN_SEP - d) / 2;
            const nx = dx / d, nz = dz / d;
            a.pos[0] -= nx * push; a.pos[2] -= nz * push;
            b.pos[0] += nx * push; b.pos[2] += nz * push;
          } else if (d === 0) {
            // stessa posizione esatta: piccolo scarto casuale per separarli
            a.pos[0] -= 0.1; b.pos[0] += 0.1;
          }
        }
      }
    }
  }

  function generateTrajectory(nodes) {
    const totalFrames = window.__veritasTotalFrames || 361, agentCount = window.__veritasAgentCount || 28;
    const TYPE_ORDER = ["checkin", "security", "lounge"];
    const trunk = [];
    for (const ty of TYPE_ORDER) { const n = nodes.find((nd) => nd.type === ty); if (n) trunk.push(n); }
    // spawn multipli: se il progetto ha piu' punti di tipo "spawn" (piu' ingressi/varchi),
    // i gruppi di agenti vengono distribuiti su tutti, non solo sul primo trovato
    const spawnNodes = nodes.filter((nd) => nd.type === "spawn");
    const gates = nodes.filter((nd) => nd.type === "gate");
    // se non ci sono nodi "trunk"/spawn riconosciuti o nessun gate, usa la sequenza
    // originale intera come unico ramo (comportamento di sicurezza)
    const hasBranching = (spawnNodes.length + trunk.length) >= 1 && gates.length >= 1;
    const fallbackPath = nodes;

    // Espande una sequenza di nodi in un percorso reale, inserendo waypoint
    // intermedi (dalle zone rilevate) dove la linea diretta non e "libera" —
    // cosi gli agenti girano attorno agli ostacoli invece di attraversarli.
    function expandRoute(rawNodes) {
      const expanded = [{ pos: rawNodes[0].pos }];
      let securityAt = null, cum = 0;
      if (rawNodes[0].type === "security") securityAt = 0;
      for (let s = 0; s < rawNodes.length - 1; s++) {
        const from = rawNodes[s].pos, to = rawNodes[s + 1].pos;
        const via = findRoute(from, to); // array di posizioni intermedie + destinazione finale
        let prev = from;
        for (const wp of via) {
          expanded.push({ pos: wp });
          cum += Math.hypot(wp[0] - prev[0], wp[2] - prev[2]);
          prev = wp;
        }
        if (rawNodes[s + 1].type === "security") securityAt = cum;
      }
      return { path: expanded, securityAt };
    }

    const keys = Object.keys(ARCHETYPES);
    const agents = [];
    const routeCache = new Map();
    for (let i = 0; i < agentCount; i++) {
      const group = Math.floor(i / 3);
      const archetype = group % 3 === 1 ? "family" : keys[i % keys.length];
      // stesso gruppo (famiglia/comitiva) va sempre allo stesso gate
      const gateIdx = gates.length ? group % gates.length : 0;
      // ogni gruppo (famiglia/comitiva) entra sempre dallo stesso varco, ma varchi
      // diversi tra i gruppi se il progetto ne definisce piu' di uno
      const spawnIdx = spawnNodes.length ? group % spawnNodes.length : 0;
      const startNodes = spawnNodes.length ? [spawnNodes[spawnIdx]] : [];
      const rawPath = hasBranching ? startNodes.concat(trunk, [gates[gateIdx]]) : fallbackPath;
      const cacheKey = spawnIdx + "_" + gateIdx; // percorso diverso per combinazione varco+gate
      if (!routeCache.has(cacheKey)) routeCache.set(cacheKey, expandRoute(rawPath));
      const { path, securityAt } = routeCache.get(cacheKey);
      const segLen = [];
      let totalLen = 0;
      for (let s = 0; s < path.length - 1; s++) {
        const a = path[s].pos, b = path[s + 1].pos;
        const dd = Math.hypot(b[0] - a[0], b[2] - a[2]);
        segLen.push(dd); totalLen += dd;
      }
      agents.push({
        id: i, archetype, group, path, segLen, totalLen, securityAt,
        startDelay: (i * 0.9) % 18 + Math.random() * 0.6,
        speed: ARCHETYPES[archetype].speed * (0.9 + Math.random() * 0.2),
        waitAtControl: 4 + Math.random() * 8,
      });
    }
    // ordine di coda al varco sicurezza: chi parte prima arriva prima in coda
    const queueOrder = agents.slice().sort((a, b) => a.startDelay - b.startDelay);
    const queueSlot = new Map();
    queueOrder.forEach((ag, i) => queueSlot.set(ag.id, i));

    const frames = [];
    const lastPos = new Map();
    for (let f = 0; f < totalFrames; f++) {
      const t = f * 0.5;
      const frameAgents = [];
      const groupCenter = new Map();
      for (const ag of agents) {
        const p = lastPos.get(ag.id);
        if (!p) continue;
        const gc = groupCenter.get(ag.group) || { x: 0, z: 0, count: 0 };
        gc.x += p[0]; gc.z += p[2]; gc.count++;
        groupCenter.set(ag.group, gc);
      }
      for (const [, gc] of groupCenter) if (gc.count > 0) { gc.x /= gc.count; gc.z /= gc.count; }
      for (const ag of agents) {
        const elapsed = t - ag.startDelay;
        if (elapsed < 0) continue;
        const { path, segLen, totalLen, securityAt } = ag;
        if (totalLen <= 0 || path.length < 2) continue;
        let state = "MOVING";
        let dist = elapsed * ag.speed * 2.2;
        if (securityAt !== null) {
          if (dist > securityAt && dist < securityAt + ag.waitAtControl * ag.speed * 0.5) { state = "WAITING"; dist = securityAt; }
          else if (dist > securityAt && state !== "WAITING") dist += ag.waitAtControl * ag.speed * 0.2;
        }
        if (dist >= totalLen) { state = "ARRIVED"; dist = totalLen; }
        let acc = 0, seg = 0;
        for (; seg < segLen.length; seg++) { if (dist <= acc + segLen[seg]) break; acc += segLen[seg]; }
        if (seg >= segLen.length) seg = segLen.length - 1;
        const localT = segLen[seg] > 0 ? (dist - acc) / segLen[seg] : 0;
        const a0 = path[seg].pos, a1 = (path[seg + 1] || path[seg]).pos;
        let x = a0[0] + (a1[0] - a0[0]) * localT;
        let z = a0[2] + (a1[2] - a0[2]) * localT;
        let y = (a0[1] || 0) + ((a1[1] || 0) - (a0[1] || 0)) * localT;
        const dx = a1[0] - a0[0], dz = a1[2] - a0[2];
        const len = Math.hypot(dx, dz) || 1;
        const perpX = -dz / len, perpZ = dx / len;
        if (state === "WAITING" && securityAt !== null) {
          // coda visibile: si dispone in fila dietro il varco, su 2 colonne,
          // arretrando lungo la direzione di provenienza in base alla posizione in coda
          const slot = queueSlot.get(ag.id) || 0;
          const row = Math.floor(slot / 2), col = slot % 2 === 0 ? -1 : 1;
          x -= (dx / len) * (row * 0.9);
          z -= (dz / len) * (row * 0.9);
          x += perpX * col * 0.55;
          z += perpZ * col * 0.55;
        } else {
          const lateral = (ag.id % 3 - 1) * 0.6 + Math.sin(t * 0.5 + ag.id) * 0.2;
          x += perpX * lateral;
          z += perpZ * lateral;
        }
        const gc = groupCenter.get(ag.group);
        if (gc && state === "MOVING" && Math.random() < 0.9) { x += (gc.x - x) * 0.08; z += (gc.z - z) * 0.08; }
        x += (Math.random() - 0.5) * 0.015;
        z += (Math.random() - 0.5) * 0.015;
        const rot = Math.atan2(dz, dx);
        const stress = state === "WAITING" ? 0.7 + Math.sin(t + ag.id) * 0.2 : state === "ARRIVED" ? 0.1 : 0.2 + seg * 0.08;
        const pos = [x, y, z];
        lastPos.set(ag.id, pos);
        frameAgents.push({ id: ag.id, pos, rot, state, group: ag.group, archetype: ag.archetype, stress });
      }
      resolveOverlaps(frameAgents);
      frames.push({ t, agents: frameAgents });
    }
    return { nodes, frames, duration: 180 };
  }


  const KEYWORDS = {
    spawn: ["ingresso", "entrance", "entry", "parcheggio", "parking", "arrival"],
    checkin: ["checkin", "check-in", "accettazione", "reception", "counter", "banco", "desk"],
    security: ["security", "controllo", "varco", "sicurezza", "scan", "metal", "check"],
    lounge: ["lounge", "attesa", "waiting", "sala"],
    gate: ["gate", "imbarco", "boarding"],
  };

  function mat4xVec4(e, v) {
    return [
      e[0] * v[0] + e[4] * v[1] + e[8] * v[2] + e[12] * v[3],
      e[1] * v[0] + e[5] * v[1] + e[9] * v[2] + e[13] * v[3],
      e[2] * v[0] + e[6] * v[1] + e[10] * v[2] + e[14] * v[3],
      e[3] * v[0] + e[7] * v[1] + e[11] * v[2] + e[15] * v[3],
    ];
  }

  function worldPosOf(mesh) {
    const e = mesh.matrixWorld.elements;
    return [e[12], e[13], e[14]];
  }

  function analyzeMesh(root) {
    const found = {};
    const boxMin = [Infinity, Infinity, Infinity];
    const boxMax = [-Infinity, -Infinity, -Infinity];
    root.updateMatrixWorld(true);
    root.traverse((obj) => {
      if (!obj.isMesh) return;
      const name = (obj.name || "").toLowerCase();
      for (const type in KEYWORDS) {
        if (found[type]) continue;
        if (KEYWORDS[type].some((kw) => name.includes(kw))) {
          found[type] = { type, label: obj.name || type, pos: worldPosOf(obj) };
        }
      }
      if (obj.geometry) {
        if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
        const bb = obj.geometry.boundingBox;
        if (bb) {
          const corners = [
            [bb.min.x, bb.min.y, bb.min.z], [bb.max.x, bb.min.y, bb.min.z],
            [bb.min.x, bb.max.y, bb.min.z], [bb.max.x, bb.max.y, bb.min.z],
            [bb.min.x, bb.min.y, bb.max.z], [bb.max.x, bb.min.y, bb.max.z],
            [bb.min.x, bb.max.y, bb.max.z], [bb.max.x, bb.max.y, bb.max.z],
          ];
          for (const c of corners) {
            const w = mat4xVec4(obj.matrixWorld.elements, [c[0], c[1], c[2], 1]);
            for (let ax = 0; ax < 3; ax++) {
              if (w[ax] < boxMin[ax]) boxMin[ax] = w[ax];
              if (w[ax] > boxMax[ax]) boxMax[ax] = w[ax];
            }
          }
        }
      }
    });

    const foundCount = Object.keys(found).length;
    const nodes = [];
    let idc = 0;
    if (foundCount >= 3) {
      const order = ["spawn", "checkin", "security", "lounge", "gate"];
      for (const type of order) {
        if (found[type]) nodes.push({ id: `auto_${idc++}`, type, label: found[type].label, pos: found[type].pos });
      }
      return nodes.length >= 2 ? nodes : null;
    }
    // fallback: nessun nome utile trovato negli oggetti -> usa il clustering
    // geometrico reale (KMeans sui punti navigabili) invece di una semplice
    // suddivisione del bounding box
    const structural = runStructuralAnalysis(root);
    const order2 = ["spawn", "checkin", "security", "lounge", "gate"];
    if (structural && structural.flowOrder.length >= 2) {
      const path = structural.flowOrder;
      const stepIdx = (i) => Math.round((i / (order2.length - 1)) * (path.length - 1));
      for (let i = 0; i < order2.length; i++) {
        const zone = path[Math.min(path.length - 1, stepIdx(i))];
        // altezza reale del punto preservata (non piu forzata a 0) — essenziale
        // per mesh con piu livelli, altrimenti i punti finiscono tutti a terra
        // anche quando la zona reale e a un piano superiore.
        nodes.push({ id: `auto_${idc++}`, type: order2[i], label: TYPE_OPTIONS.find((o) => o.value === order2[i]).label, pos: [zone.pos[0], zone.pos[1], zone.pos[2]], floorIdx: zone.floorIdx });
      }
      return nodes;
    }
    // fallback estremo: nessun punto navigabile rilevabile -> bounding box grezzo
    if (!isFinite(boxMin[0])) return null;
    const spanX = boxMax[0] - boxMin[0], spanZ = boxMax[2] - boxMin[2];
    const longAxis = spanX >= spanZ ? "x" : "z";
    const midOther = longAxis === "x" ? (boxMin[2] + boxMax[2]) / 2 : (boxMin[0] + boxMax[0]) / 2;
    const fracs = [0.05, 0.28, 0.5, 0.72, 0.95];
    for (let i = 0; i < order2.length; i++) {
      const t = fracs[i];
      let x, z;
      if (longAxis === "x") { x = boxMin[0] + spanX * t; z = midOther; }
      else { z = boxMin[2] + spanZ * t; x = midOther; }
      nodes.push({ id: `auto_${idc++}`, type: order2[i], label: TYPE_OPTIONS.find((o) => o.value === order2[i]).label, pos: [x, 0, z] });
    }
    return nodes;
  }

    // ============================================================
  // Livello 1 — Analisi geometrica reale della mesh
  // (porting in JS della logica di topology_analyzer.py: estrazione
  // punti navigabili dai vertici con normale verso l'alto, clustering
  // KMeans reale, stima larghezza corridoi via PCA locale)
  // ============================================================
  const EXCLUDE_KEYWORDS = ["runway", "taxiway", "pista", "piazzale", "apron", "tarmac", "road", "strada", "terreno", "ground", "asphalt", "asfalto", "parcheggio_auto", "landscape", "terrain"];

  function extractNavigablePoints(root, maxSamples) {
    maxSamples = maxSamples || 4000;
    root.updateMatrixWorld(true);
    // Passo 1: raccoglie i punti "verso l'alto" per ogni singola mesh separatamente,
    // insieme all'impronta (area XZ) di quella mesh nel mondo reale.
    const perMesh = [];
    root.traverse((obj) => {
      if (!obj.isMesh || !obj.geometry) return;
      const name = (obj.name || "").toLowerCase();
      if (EXCLUDE_KEYWORDS.some((kw) => name.includes(kw))) return;
      const geo = obj.geometry;
      const posAttr = geo.attributes && geo.attributes.position;
      const normAttr = geo.attributes && geo.attributes.normal;
      if (!posAttr || !posAttr.count) return;
      const stride = Math.max(1, Math.floor(posAttr.count / 600));
      const mw = obj.matrixWorld.elements;
      const pts = [];
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      for (let i = 0; i < posAttr.count; i += stride) {
        const lx = posAttr.getX(i), ly = posAttr.getY(i), lz = posAttr.getZ(i);
        const w = mat4xVec4(mw, [lx, ly, lz, 1]);
        let ny = 1;
        if (normAttr) {
          const nx0 = normAttr.getX(i), ny0 = normAttr.getY(i), nz0 = normAttr.getZ(i);
          const wn = mat4xVec4(mw, [nx0, ny0, nz0, 0]);
          const len = Math.hypot(wn[0], wn[1], wn[2]) || 1;
          ny = wn[1] / len;
        }
        if (ny > 0.75) {
          pts.push([w[0], w[1], w[2]]);
          if (w[0] < minX) minX = w[0]; if (w[0] > maxX) maxX = w[0];
          if (w[2] < minZ) minZ = w[2]; if (w[2] > maxZ) maxZ = w[2];
        }
      }
      if (pts.length) perMesh.push({ pts, footprint: (maxX - minX) * (maxZ - minZ) || 0.01 });
    });
    if (!perMesh.length) return [];
    // Passo 2: scarta le mesh con impronta "fuori scala" rispetto alla mediana
    // (piste, piazzali, terreno esterno sono tipicamente enormi rispetto agli
    // ambienti interni) — evita che l'analisi confonda l'esterno con l'interno.
    const footprints = perMesh.map((m) => m.footprint).sort((a, b) => a - b);
    const median = footprints[Math.floor(footprints.length / 2)] || 1;
    let filtered = perMesh.filter((m) => m.footprint <= median * 6);
    const excluded = perMesh.filter((m) => m.footprint > median * 6);
    if (!filtered.length) { filtered = perMesh; } // rete di sicurezza: se il filtro scarta tutto, ripiega sul dataset intero
    // Centroide delle superfici escluse (piste/piazzali) — usato come riferimento
    // direzionale "lato volo" per ordinare le zone interne dal lato terra
    // (ingresso) al lato volo (gate), come farebbe un progettista aeroportuale.
    let airsideAnchor = null;
    if (excluded.length) {
      let sx = 0, sz = 0, cnt = 0;
      for (const m of excluded) for (const p of m.pts) { sx += p[0]; sz += p[2]; cnt++; }
      if (cnt) airsideAnchor = [sx / cnt, 0, sz / cnt];
    }
    let points = [];
    for (const m of filtered) points = points.concat(m.pts);
    if (points.length > maxSamples) {
      const strideOut = Math.ceil(points.length / maxSamples);
      points = points.filter((_, i) => i % strideOut === 0);
    }
    return { points, airsideAnchor };
  }

  function dist2(a, b) {
    const dx = a[0] - b[0], dy = a[1] - b[1], dz = a[2] - b[2];
    return dx * dx + dy * dy + dz * dz;
  }

  function kmeansCluster(points, k, iterations) {
    iterations = iterations || 15;
    if (!points.length) return { centers: [], assign: [] };
    k = Math.min(k, points.length);
    const centers = [points[0]];
    while (centers.length < k) {
      let best = null, bestDist = -1;
      for (const p of points) {
        let d = Infinity;
        for (const c of centers) d = Math.min(d, dist2(p, c));
        if (d > bestDist) { bestDist = d; best = p; }
      }
      centers.push(best);
    }
    let assign = new Array(points.length).fill(0);
    for (let it = 0; it < iterations; it++) {
      for (let i = 0; i < points.length; i++) {
        let best = 0, bestD = Infinity;
        for (let c = 0; c < centers.length; c++) {
          const d = dist2(points[i], centers[c]);
          if (d < bestD) { bestD = d; best = c; }
        }
        assign[i] = best;
      }
      const sums = centers.map(() => [0, 0, 0, 0]);
      for (let i = 0; i < points.length; i++) {
        const s = sums[assign[i]];
        s[0] += points[i][0]; s[1] += points[i][1]; s[2] += points[i][2]; s[3]++;
      }
      for (let c = 0; c < centers.length; c++) {
        if (sums[c][3] > 0) centers[c] = [sums[c][0] / sums[c][3], sums[c][1] / sums[c][3], sums[c][2] / sums[c][3]];
      }
    }
    return { centers, assign };
  }

  function clusterWidths(points, assign, clusterIndex) {
    const pts = [];
    for (let i = 0; i < assign.length; i++) if (assign[i] === clusterIndex) pts.push(points[i]);
    if (pts.length < 3) return { widthMinor: null, widthMajor: null, count: pts.length };
    const mx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const mz = pts.reduce((s, p) => s + p[2], 0) / pts.length;
    let cxx = 0, cxz = 0, czz = 0;
    for (const p of pts) {
      const dx = p[0] - mx, dz = p[2] - mz;
      cxx += dx * dx; cxz += dx * dz; czz += dz * dz;
    }
    cxx /= pts.length; cxz /= pts.length; czz /= pts.length;
    const trace = cxx + czz, det = cxx * czz - cxz * cxz;
    const half = trace / 2;
    const disc = Math.max(0, half * half - det);
    const eig1 = half + Math.sqrt(disc), eig2 = half - Math.sqrt(disc);
    let vx = 1, vz = 0;
    if (Math.abs(cxz) > 1e-9) { vx = eig1 - czz; vz = cxz; const l = Math.hypot(vx, vz) || 1; vx /= l; vz /= l; }
    const majorAxis = [vx, vz], minorAxis = [-vz, vx];
    let majMin = Infinity, majMax = -Infinity, minMin = Infinity, minMax = -Infinity;
    for (const p of pts) {
      const dx = p[0] - mx, dz = p[2] - mz;
      const projMaj = dx * majorAxis[0] + dz * majorAxis[1];
      const projMin = dx * minorAxis[0] + dz * minorAxis[1];
      if (projMaj < majMin) majMin = projMaj; if (projMaj > majMax) majMax = projMaj;
      if (projMin < minMin) minMin = projMin; if (projMin > minMax) minMax = projMin;
    }
    return { widthMajor: majMax - majMin, widthMinor: minMax - minMin, count: pts.length, eig1, eig2 };
  }

  function nearestNeighborOrder(items) {
    if (!items.length) return [];
    const remaining = items.slice(1);
    const ordered = [items[0]];
    let current = items[0];
    while (remaining.length) {
      let bestI = 0, bestD = Infinity;
      for (let i = 0; i < remaining.length; i++) {
        const d = dist2(current.pos, remaining[i].pos);
        if (d < bestD) { bestD = d; bestI = i; }
      }
      current = remaining.splice(bestI, 1)[0];
      ordered.push(current);
    }
    return ordered;
  }

  const CORRIDOR_MIN_WIDTH = 1.5; // soglia indicativa di riferimento (m), non normativa certificata

  function detectFloorLevels(points) {
    if (!points.length) return [0];
    const ys = points.map((p) => p[1]).sort((a, b) => a - b);
    const levels = [];
    let bandStart = 0;
    for (let i = 1; i <= ys.length; i++) {
      if (i === ys.length || ys[i] - ys[i - 1] > 1.5) {
        const band = ys.slice(bandStart, i);
        levels.push(band[Math.floor(band.length / 2)]); // mediana della fascia
        bandStart = i;
      }
    }
    return levels;
  }

  let lastNavigablePoints = null;
  let lastFloorLevels = [0];
  let lastZones = null;

  function runStructuralAnalysis(root) {
    const extraction = extractNavigablePoints(root);
    const points = extraction.points, airsideAnchor = extraction.airsideAnchor;
    lastNavigablePoints = points;
    lastFloorLevels = detectFloorLevels(points);
    if (points.length < 10) return null;
    const k = Math.min(10, Math.max(3, Math.round(points.length / 200)));
    const { centers, assign } = kmeansCluster(points, k);
    const cx = centers.reduce((s, c) => s + c[0], 0) / centers.length;
    const cz = centers.reduce((s, c) => s + c[2], 0) / centers.length;
    const zones = centers.map((c, i) => {
      const w = clusterWidths(points, assign, i);
      const distFromCenter = Math.hypot(c[0] - cx, c[2] - cz);
      const distFromAirside = airsideAnchor ? Math.hypot(c[0] - airsideAnchor[0], c[2] - airsideAnchor[2]) : null;
      const role = w.widthMinor !== null && w.widthMajor !== null && w.widthMajor > w.widthMinor * 2 ? "corridoio" : "area";
      const flagged = role === "corridoio" && w.widthMinor !== null && w.widthMinor < CORRIDOR_MIN_WIDTH;
      let floorIdx = 0, floorDist = Infinity;
      lastFloorLevels.forEach((lvl, li) => { const d = Math.abs(c[1] - lvl); if (d < floorDist) { floorDist = d; floorIdx = li; } });
      return { pos: c, ...w, role, flagged, distFromCenter, distFromAirside, floorIdx };
    });
    zones.sort((a, b) => b.distFromCenter - a.distFromCenter);
    const nEntrances = Math.max(1, Math.round(zones.length * 0.25));
    zones.forEach((z, i) => { z.isEntranceCandidate = i < nEntrances; });
    // Ordine di flusso: se abbiamo un riferimento "lato volo" (pista/piazzale),
    // ordiniamo dal punto più lontano (lato terra/ingresso) al più vicino
    // (lato volo/gate) — altrimenti ripieghiamo sulla catena nearest-neighbor.
    const flowOrder = airsideAnchor
      ? zones.slice().sort((a, b) => b.distFromAirside - a.distFromAirside)
      : nearestNeighborOrder(zones.slice());
    const ordered = nearestNeighborOrder(zones.slice());
    const critici = zones.filter((z) => z.flagged).length;
    const score = Math.max(0, Math.min(100, 100 - critici * 15 - Math.max(0, 10 - zones.length) * 2));
    lastZones = zones;
    return { zones, ordered, flowOrder, hasAirsideReference: !!airsideAnchor, pointsAnalyzed: points.length, score, critici, floorLevels: lastFloorLevels };
  }

  let lastStructuralReport = null;

  function showStructuralReport(report) {
    const existing = document.getElementById("veritas-report-modal");
    if (existing) existing.remove();
    const modal = document.createElement("div");
    modal.id = "veritas-report-modal";
    modal.style.cssText = "position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px;font-family:'JetBrains Mono',monospace;";
    const rows = report.zones
      .map((z, i) => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:11px;">
        <span>${z.role === "corridoio" ? "↔" : "▢"} ${t("zone_word")} ${i + 1} ${(report.floorLevels || [0]).length > 1 ? "· P" + z.floorIdx : ""} ${z.isEntranceCandidate ? t("entrance_candidate") : ""}</span>
        <span style="color:${z.flagged ? "#fca5a5" : "#94a3b8"};">${z.widthMinor !== null ? z.widthMinor.toFixed(2) + "m" : "n/d"} ${z.flagged ? t("below_threshold") : ""}</span>
      </div>`)
      .join("");
    modal.innerHTML = `
      <div style="max-width:480px;width:100%;max-height:80vh;overflow:auto;background:#11151f;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;color:#e2e8f0;position:relative;">
        ${langSwitcherHtml()}
        <h2 style="margin:0 0 4px;font-size:14px;color:#93c5fd;letter-spacing:0.05em;">${t("report_title")}</h2>
        <p style="font-size:10.5px;color:#64748b;margin:0 0 16px;">${t("report_desc")}</p>
        <p style="font-size:10.5px;color:${report.hasAirsideReference ? "#4ade80" : "#fbbf24"};margin:0 0 16px;">${report.hasAirsideReference ? t("airside_yes") : t("airside_no")}</p>
        <div style="display:flex;gap:12px;margin-bottom:16px;">
          <div style="flex:1;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:22px;font-weight:700;color:${report.score >= 70 ? "#4ade80" : report.score >= 40 ? "#fbbf24" : "#fca5a5"};">${report.score}</div>
            <div style="font-size:9.5px;color:#64748b;">${t("score_label")}</div>
          </div>
          <div style="flex:1;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:22px;font-weight:700;">${report.zones.length}</div>
            <div style="font-size:9.5px;color:#64748b;">${t("zones_label")}</div>
          </div>
          <div style="flex:1;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:22px;font-weight:700;color:${report.critici ? "#fca5a5" : "#4ade80"};">${report.critici}</div>
            <div style="font-size:9.5px;color:#64748b;">${t("critical_label")}</div>
          </div>
          <div style="flex:1;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:22px;font-weight:700;">${(report.floorLevels || [0]).length}</div>
            <div style="font-size:9.5px;color:#64748b;">${t("floors_label")}</div>
          </div>
        </div>
        <div style="margin-bottom:16px;">${rows}</div>
        <p style="font-size:9.5px;color:#64748b;margin-bottom:16px;">${t("based_on_points", report.pointsAnalyzed)}</p>
        <button id="vp-report-close" style="width:100%;padding:11px;border-radius:8px;border:none;background:#fff;color:#000;font-weight:600;font-family:inherit;font-size:12px;cursor:pointer;">${t("close_btn")}</button>
      </div>
    `;
    document.body.appendChild(modal);
    modal.querySelectorAll(".v-lang").forEach((el) => {
      el.onclick = () => { setLang(el.getAttribute("data-l")); showStructuralReport(report); };
    });
    modal.querySelector("#vp-report-close").onclick = () => modal.remove();
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
  }

  let currentNodes = [];
  let selectedIndex = null;
  let idCounter = 0;
  let panelBuilt = false;

  function seedNodesIfNeeded() {
    if (currentNodes.length) return;
    const traj = window.__veritasGetTrajectory && window.__veritasGetTrajectory();
    currentNodes = (traj && traj.nodes) || window.__veritasInitialNodes || [];
    idCounter = currentNodes.length;
  }

  window.__veritasOnModelLoaded = function (modelRoot) {
    seedNodesIfNeeded();
    const hasOnlyDemoPoints = window.__veritasInitialNodes === null || window.__veritasInitialNodes === undefined;
    if (hasOnlyDemoPoints) {
      const analyzed = analyzeMesh(modelRoot);
      if (analyzed && analyzed.length >= 2) {
        currentNodes = analyzed;
        idCounter = currentNodes.length;
        applyNodesToScene();
        if (panelBuilt) renderListRef && renderListRef();
      }
    }
  };

  let renderListRef = null;

  function moveHotspotVisual(index, x, z) {
    const grp = window.__veritasHotspotGroup;
    if (!grp) return;
    for (const childIdx of [index * 3, index * 3 + 1, index * 3 + 2]) {
      const obj = grp.children[childIdx];
      if (obj) { obj.position.x = x; obj.position.z = z; }
    }
    applyMarkerScale(index); // riapplica anche la quota Y corretta (base + altezza pillar)
  }

  const TYPE_BASE_HEIGHT = { gate: 3.5, security: 2.2, checkin: 2, lounge: 2, spawn: 2 };

  function applyMarkerScale(index) {
    const grp = window.__veritasHotspotGroup;
    if (!grp) return;
    const node = currentNodes[index];
    if (!node) return;
    const factor = node.scale || 1;
    const floorY = node.pos[1] || 0; // quota del piano su cui si trova il punto
    const box = grp.children[index * 3], ring = grp.children[index * 3 + 1], sprite = grp.children[index * 3 + 2];
    const baseH = (box && box.geometry && box.geometry.parameters && box.geometry.parameters.height) || TYPE_BASE_HEIGHT[node.type] || 2;
    if (box) { box.scale.set(factor, factor, factor); box.position.y = floorY + (baseH * factor) / 2; }
    if (ring) { ring.scale.set(factor, factor, 1); ring.position.y = floorY + 0.02; }
    if (sprite) { sprite.scale.set(6 * factor, 1.5 * factor, 1); sprite.position.y = floorY + baseH * factor + 1.2; }
  }

  const CAMERA_OFFSETS = {
    varco: [-8, 14, 10], controllo: [3, 5, -6], lounge: [-8, 12, 14],
    imbarco: [-4, 10, -10], gateA: [-2, 5, -6], accettazione: [-2, 9, 8],
  };

  function syncCamerasToNodes() {
    const presets = window.__veritasCameraPresets;
    if (!presets) return;
    const byType = {};
    currentNodes.forEach((n) => { (byType[n.type] = byType[n.type] || []).push(n); });
    const assign = (camId, node) => {
      if (!node) return;
      const cam = presets.find((c) => c.id === camId);
      if (!cam) return;
      const off = CAMERA_OFFSETS[camId];
      const floorY = node.pos[1] || 0;
      // la quota della telecamera segue il piano del nodo, non sempre terra
      cam.target = [node.pos[0], floorY, node.pos[2]];
      cam.pos = [node.pos[0] + off[0], floorY + off[1], node.pos[2] + off[2]];
    };
    const security = byType.security || [];
    assign("varco", security[0]);
    assign("controllo", security[0]);
    const gates = byType.gate || [];
    assign("imbarco", gates[0]);
    assign("gateA", gates[1] || gates[0]);
    assign("lounge", (byType.lounge || [])[0]);
    assign("accettazione", (byType.checkin || [])[0]);
    // Global (vista dall'alto): non e agganciata a un nodo singolo, ma deve
    // comunque seguire la quota reale dell'edificio — altrimenti su una mesh
    // con piano reale lontano da y=0 i passeggeri restano fuori inquadratura.
    if (currentNodes.length) {
      const avgY = currentNodes.reduce((s, n) => s + (n.pos[1] || 0), 0) / currentNodes.length;
      const avgX = currentNodes.reduce((s, n) => s + n.pos[0], 0) / currentNodes.length;
      const avgZ = currentNodes.reduce((s, n) => s + n.pos[2], 0) / currentNodes.length;
      const g = presets.find((c) => c.id === "global");
      if (g) { g.target = [avgX, avgY, avgZ]; g.pos = [avgX, avgY + 80, avgZ]; }
    }
  }

  function applyNodesToScene() {
    const traj = window.__veritasGetTrajectory && window.__veritasGetTrajectory();
    if (!traj) return;
    const fresh = generateTrajectory(currentNodes);
    traj.nodes = currentNodes;
    traj.frames.length = 0;
    traj.frames.push(...fresh.frames);
    currentNodes.forEach((n, i) => { moveHotspotVisual(i, n.pos[0], n.pos[2]); applyMarkerScale(i); });
    syncCamerasToNodes();
  }

  function projectToScreen(x, y, z, camera, w, h) {
    const view = mat4xVec4(camera.matrixWorldInverse.elements, [x, y, z, 1]);
    const clip = mat4xVec4(camera.projectionMatrix.elements, view);
    if (clip[3] <= 0) return null;
    const ndcX = clip[0] / clip[3], ndcY = clip[1] / clip[3];
    return { x: (ndcX * 0.5 + 0.5) * w, y: (1 - (ndcY * 0.5 + 0.5)) * h };
  }

  function unprojectToFloor(clientX, clientY, canvasEl, camera) {
    const rect = canvasEl.getBoundingClientRect();
    const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
    const ndcY = -((clientY - rect.top) / rect.height) * 2 + 1;
    const invProj = camera.projectionMatrixInverse.elements;
    const invView = camera.matrixWorld.elements;
    let p = mat4xVec4(invProj, [ndcX, ndcY, -1, 1]);
    p = p.map((v) => v / p[3]);
    let world = mat4xVec4(invView, [p[0], p[1], p[2], 1]);
    world = world.map((v) => v / world[3]);
    const camPos = [invView[12], invView[13], invView[14]];
    const dx = world[0] - camPos[0], dy = world[1] - camPos[1], dz = world[2] - camPos[2];
    if (Math.abs(dy) < 1e-6) return null;
    // Mesh multipiano: prova ogni livello rilevato (da Rianalizza mesh / Report
    // struttura), e sceglie quello piu vicino alla telecamera che ha davvero
    // punti navigabili nelle vicinanze — cosi il click cade sul piano giusto
    // invece di essere sempre forzato a terra.
    const levels = lastFloorLevels && lastFloorLevels.length ? lastFloorLevels : [0];
    const candidates = [];
    for (const lvl of levels) {
      const t = (lvl - camPos[1]) / dy;
      if (t <= 0) continue;
      const cx = camPos[0] + dx * t, cz = camPos[2] + dz * t;
      let support = false;
      if (lastNavigablePoints && lastNavigablePoints.length) {
        for (const np of lastNavigablePoints) {
          if (Math.abs(np[1] - lvl) < 1 && Math.hypot(np[0] - cx, np[2] - cz) < 3) { support = true; break; }
        }
      }
      candidates.push({ x: cx, y: lvl, z: cz, dist: t, support });
    }
    const supported = candidates.filter((c) => c.support).sort((a, b) => a.dist - b.dist);
    if (supported.length) return supported[0];
    if (candidates.length) return candidates.sort((a, b) => a.dist - b.dist)[0];
    const t0 = (0 - camPos[1]) / dy;
    if (t0 <= 0) return null;
    return { x: camPos[0] + dx * t0, y: 0, z: camPos[2] + dz * t0 };
  }

  function initPickerPanel() {
    seedNodesIfNeeded();
    if (document.getElementById("veritas-picker-panel")) return;
    panelBuilt = true;
    const panel = document.createElement("div");
    panel.id = "veritas-picker-panel";
    panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 id="vp-drag-handle" style="margin:0;cursor:grab;" title="${t("drag_hint")}">⠿ ${t("panel_title")} • ${window.__veritasProjectName || ""}</h2>
        <div style="display:flex;gap:4px;align-items:center;">
          <button class="vp-lang-mini" data-l="it" style="font-size:8px;padding:2px 4px;border-radius:4px;border:1px solid rgba(255,255,255,0.15);background:${LANG === "it" ? "#fff" : "transparent"};color:${LANG === "it" ? "#000" : "#94a3b8"};cursor:pointer;">IT</button>
          <button class="vp-lang-mini" data-l="en" style="font-size:8px;padding:2px 4px;border-radius:4px;border:1px solid rgba(255,255,255,0.15);background:${LANG === "en" ? "#fff" : "transparent"};color:${LANG === "en" ? "#000" : "#94a3b8"};cursor:pointer;">EN</button>
          <button id="vp-collapse" title="Nascondi pannello" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#e2e8f0;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:11px;line-height:1;">—</button>
        </div>
      </div>
      <select id="vp-type">${TYPE_OPTIONS.map((o) => `<option value="${o.value}">${o.label}</option>`).join("")}</select>
      <input type="text" id="vp-label" placeholder="${t("label_placeholder")}">
      <button class="vp-btn" id="vp-place">${t("place_new_btn")}</button>
      <div class="vp-list" id="vp-list"></div>
      <div class="vp-hint" style="margin-bottom:8px;">${t("hint_select")}</div>
      <div id="vp-scale-control" style="display:none;margin-bottom:10px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:8px;padding:8px;">
        <label style="display:block;font-size:9.5px;color:#93c5fd;margin-bottom:4px;">${t("marker_scale_label")} <span id="vp-marker-scale-val">1.0x</span></label>
        <input type="range" id="vp-marker-scale" min="0.05" max="6" step="0.05" value="1" style="width:100%;">
      </div>
      <button class="vp-btn" id="vp-reanalyze">${t("reanalyze_btn")}</button>
      <button class="vp-btn" id="vp-report">${t("report_btn")}</button>
      <label style="display:block;font-size:9.5px;color:#64748b;margin:6px 0 4px;">${t("passenger_scale_label")} <span id="vp-scale-val">1.0x</span></label>
      <input type="range" id="vp-scale" min="0.03" max="1.5" step="0.01" value="0.12" style="width:100%;margin-bottom:10px;">
      <button class="vp-btn primary" id="vp-regen">${t("regen_btn")}</button>
      <button class="vp-btn" id="vp-save">${t("save_btn")}</button>
    `;
    panel.querySelectorAll(".vp-lang-mini").forEach((el) => {
      el.onclick = () => { setLang(el.getAttribute("data-l")); location.reload(); };
    });
    document.body.appendChild(panel);

    const reopenTab = document.createElement("button");
    reopenTab.id = "veritas-reopen-tab";
    reopenTab.textContent = t("reopen_tab");
    reopenTab.style.cssText = "position:fixed;z-index:9000;display:none;background:rgba(12,15,23,0.95);color:#e2e8f0;border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;";
    document.body.appendChild(reopenTab);

    function applySavedPosition() {
      let posStr = null;
      try { posStr = localStorage.getItem("veritasPanelPos"); } catch (e) {}
      let pos = posStr ? JSON.parse(posStr) : null;
      if (!pos) pos = { right: 280, top: 70 };
      panel.style.right = "";
      panel.style.left = pos.left != null ? pos.left + "px" : "";
      panel.style.right = pos.left != null ? "" : pos.right + "px";
      panel.style.top = pos.top + "px";
      reopenTab.style.left = panel.style.left;
      reopenTab.style.right = panel.style.right;
      reopenTab.style.top = panel.style.top;
    }
    applySavedPosition();

    function savePosition() {
      const rect = panel.getBoundingClientRect();
      const pos = { left: rect.left, top: rect.top };
      try { localStorage.setItem("veritasPanelPos", JSON.stringify(pos)); } catch (e) {}
      panel.style.left = rect.left + "px";
      panel.style.right = "";
      panel.style.top = rect.top + "px";
      reopenTab.style.left = panel.style.left;
      reopenTab.style.right = "";
      reopenTab.style.top = panel.style.top;
    }

    (function enableDrag() {
      const handle = panel.querySelector("#vp-drag-handle");
      let dragging = false, dx = 0, dy = 0;
      handle.addEventListener("mousedown", (e) => {
        dragging = true;
        const rect = panel.getBoundingClientRect();
        dx = e.clientX - rect.left; dy = e.clientY - rect.top;
        handle.style.cursor = "grabbing";
        e.preventDefault();
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        panel.style.left = Math.max(0, e.clientX - dx) + "px";
        panel.style.right = "";
        panel.style.top = Math.max(0, e.clientY - dy) + "px";
      });
      window.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        handle.style.cursor = "grab";
        savePosition();
      });
    })();

    panel.querySelector("#vp-collapse").onclick = () => {
      panel.style.display = "none";
      reopenTab.style.display = "block";
    };
    reopenTab.onclick = () => {
      panel.style.display = "block";
      reopenTab.style.display = "none";
    };

    panel.style.display = "none";
    reopenTab.style.display = "block";

    const grip = document.createElement("div");
    grip.id = "veritas-grip";
    grip.style.cssText = "position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #3b82f6;border-radius:50%;pointer-events:none;z-index:8999;display:none;box-shadow:0 0 16px rgba(59,130,246,0.8);animation:veritas-pulse 1s infinite;";
    document.body.appendChild(grip);
    const gripStyle = document.createElement("style");
    gripStyle.textContent = "@keyframes veritas-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:0.6}}";
    document.head.appendChild(gripStyle);

    let placing = false;
    let gripRafId = null;

    function updateGrip() {
      if (selectedIndex === null || !window.__veritasCamera || !window.__veritasCanvasEl) {
        grip.style.display = "none";
        if (gripRafId) cancelAnimationFrame(gripRafId);
        gripRafId = null;
        return;
      }
      const n = currentNodes[selectedIndex];
      const rect = window.__veritasCanvasEl.getBoundingClientRect();
      const p = projectToScreen(n.pos[0], 0.9, n.pos[2], window.__veritasCamera, rect.width, rect.height);
      if (p) {
        grip.style.display = "block";
        grip.style.left = rect.left + p.x + "px";
        grip.style.top = rect.top + p.y + "px";
      } else {
        grip.style.display = "none";
      }
      gripRafId = requestAnimationFrame(updateGrip);
    }

    function updatePlaceBtn() {
      const btn = panel.querySelector("#vp-place");
      if (selectedIndex !== null) {
        btn.textContent = t("place_move_prefix") + currentNodes[selectedIndex].label;
        btn.classList.add("active");
      } else {
        btn.textContent = t("place_new_btn");
        btn.classList.toggle("active", placing);
      }
    }

    function updateScaleControl() {
      const box = panel.querySelector("#vp-scale-control");
      const slider = panel.querySelector("#vp-marker-scale");
      const val = panel.querySelector("#vp-marker-scale-val");
      if (selectedIndex === null || !currentNodes[selectedIndex]) {
        box.style.display = "none";
        return;
      }
      box.style.display = "block";
      const s = currentNodes[selectedIndex].scale || 1;
      slider.value = s;
      val.textContent = s.toFixed(2) + "x";
    }

    function renderList() {
      const list = panel.querySelector("#vp-list");
      list.innerHTML = currentNodes
        .map((n, i) => `<div class="vp-node" style="${i === selectedIndex ? "background:rgba(59,130,246,0.25);border:1px solid #3b82f6;" : ""}">
          <span class="lbl" data-i="${i}" style="cursor:pointer;flex:1;">${n.label}</span>
          <span class="del" data-i="${i}">✕</span>
        </div>`)
        .join("");
      list.querySelectorAll(".del").forEach((el) => {
        el.onclick = () => {
          const i = parseInt(el.getAttribute("data-i"), 10);
          currentNodes.splice(i, 1);
          if (selectedIndex === i) selectedIndex = null;
          renderList();
        };
      });
      list.querySelectorAll(".lbl").forEach((el) => {
        el.onclick = () => {
          const i = parseInt(el.getAttribute("data-i"), 10);
          selectedIndex = selectedIndex === i ? null : i;
          placing = true;
          renderList();
          updatePlaceBtn();
          updateScaleControl();
          if (selectedIndex !== null && !gripRafId) updateGrip();
          else if (selectedIndex === null) { grip.style.display = "none"; }
        };
      });
      currentNodes.forEach((n, i) => applyMarkerScale(i));
      updateScaleControl();
    }
    renderListRef = renderList;
    renderList();
    syncCamerasToNodes();

    panel.querySelector("#vp-place").onclick = () => {
      selectedIndex = null;
      placing = !placing;
      grip.style.display = "none";
      renderList();
      updatePlaceBtn();
      updateScaleControl();
    };

    panel.querySelector("#vp-marker-scale").addEventListener("input", (e) => {
      if (selectedIndex === null || !currentNodes[selectedIndex]) return;
      const v = parseFloat(e.target.value);
      currentNodes[selectedIndex].scale = v;
      panel.querySelector("#vp-marker-scale-val").textContent = v.toFixed(2) + "x";
      applyMarkerScale(selectedIndex);
    });

    function waitForSceneRefs() {
      return new Promise((resolve) => {
        const check = () => {
          if (window.__veritasScene && window.__veritasCamera && window.__veritasCanvasEl) resolve();
          else setTimeout(check, 200);
        };
        check();
      });
    }

    waitForSceneRefs().then(() => {
      const el = window.__veritasRenderer ? window.__veritasRenderer.domElement : null;
      if (!el) return;
      el.addEventListener("click", (ev) => {
        if (!placing) return;
        const hit = unprojectToFloor(ev.clientX, ev.clientY, el, window.__veritasCamera);
        if (!hit) return;
        if (selectedIndex !== null) {
          currentNodes[selectedIndex].pos = [hit.x, hit.y, hit.z];
          moveHotspotVisual(selectedIndex, hit.x, hit.z, hit.y);
          selectedIndex = null;
          placing = false;
          grip.style.display = "none";
          updateScaleControl();
        } else {
          const type = panel.querySelector("#vp-type").value;
          const label = panel.querySelector("#vp-label").value.trim() || TYPE_OPTIONS.find((o) => o.value === type).label;
          currentNodes.push({ id: `node_${idCounter++}`, type, label, pos: [hit.x, hit.y, hit.z] });
        }
        renderList();
        updatePlaceBtn();
      });
    });

    panel.querySelector("#vp-reanalyze").onclick = () => {
      if (!window.__veritasModelRoot) { alert(t("alert_load_glb_first")); return; }
      if (currentNodes.length && !confirm(t("confirm_reanalyze"))) return;
      const analyzed = analyzeMesh(window.__veritasModelRoot);
      if (!analyzed || analyzed.length < 2) { alert(t("alert_no_useful_points")); return; }
      currentNodes = analyzed;
      idCounter = currentNodes.length;
      selectedIndex = null;
      applyNodesToScene();
      renderList();
      updatePlaceBtn();
    };

    panel.querySelector("#vp-report").onclick = () => {
      if (!window.__veritasModelRoot) { alert(t("alert_load_glb_first")); return; }
      const btn = panel.querySelector("#vp-report");
      btn.textContent = t("analyzing");
      setTimeout(() => {
        const report = runStructuralAnalysis(window.__veritasModelRoot);
        btn.textContent = t("report_btn");
        if (!report) { alert(t("alert_analysis_failed")); return; }
        lastStructuralReport = report;
        showStructuralReport(report);
      }, 30);
    };

    const scaleSlider = panel.querySelector("#vp-scale");
    const scaleVal = panel.querySelector("#vp-scale-val");
    scaleSlider.value = window.__veritasPassengerScale || 0.12;
    scaleVal.textContent = parseFloat(scaleSlider.value).toFixed(2) + "x";
    scaleSlider.addEventListener("input", () => {
      const v = parseFloat(scaleSlider.value);
      scaleVal.textContent = v.toFixed(2) + "x";
      window.__veritasPassengerScale = v;
      const groups = window.__veritasPassengerGroups;
      if (groups) groups.forEach((pg) => { if (pg.group) pg.group.scale.setScalar(v); });
    });

    panel.querySelector("#vp-regen").onclick = () => {
      if (currentNodes.length < 2) { alert(t("alert_need_2_points")); return; }
      applyNodesToScene();
    };

    panel.querySelector("#vp-save").onclick = async () => {
      const btn = panel.querySelector("#vp-save");
      btn.textContent = t("saving");
      const { error } = await window.__veritasSaveProject({ nodes_config: currentNodes, sim_params: { passengerScale: window.__veritasPassengerScale || 0.12, agentCount: window.__veritasAgentCount || 28 } });
      btn.textContent = error ? t("error_generic") : t("saved");
      setTimeout(() => (btn.textContent = t("save_btn")), 1500);
    };
  }
})();
